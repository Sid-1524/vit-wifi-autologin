<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIT WiFi Auto Login</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: #1c2928;
      background: #f2f5f1;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      width: 360px;
      margin: 0;
      padding: 20px;
      background: radial-gradient(ellipse at 100% 0%, #e3eee7 0, transparent 42%), #f2f5f1;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      background: #176b59;
      color: #fff;
      font-size: 19px;
      font-weight: 750;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #56716a;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .section-label {
      margin: 0 0 10px;
      color: #61716d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .field { margin-bottom: 13px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #374744;
      font-size: 12px;
      font-weight: 650;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid #cbd6d1;
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: #1c2928;
      font: inherit;
      font-size: 13px;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #21836b;
      box-shadow: 0 0 0 3px #21836b24;
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 58px; }

    .reveal {
      position: absolute;
      top: 0;
      right: 0;
      height: 40px;
      padding: 0 11px;
      border: 0;
      background: transparent;
      color: #176b59;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .settings {
      display: grid;
      gap: 1px;
      margin: 18px 0;
      padding: 5px 12px;
      border: 1px solid #d9e1dc;
      border-radius: 8px;
      background: #fff;
    }

    .setting {
      display: flex;
      min-height: 43px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #263633;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .setting + .setting { border-top: 1px solid #edf0ee; }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #176b59;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    button { font-family: inherit; }

    #save {
      min-width: 112px;
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 7px;
      background: #176b59;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    #save:hover { background: #105744; }
    #save:active { transform: translateY(1px); }

    #clear {
      padding: 8px 2px;
      border: 0;
      background: transparent;
      color: #697873;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    #clear:hover { color: #a23b32; }

    button:focus-visible {
      outline: 3px solid #d48c40;
      outline-offset: 2px;
    }

    .footnote {
      margin: 15px 0 0;
      color: #71807b;
      font-size: 10px;
      line-height: 1.45;
    }

    #msg {
      min-height: 16px;
      margin: 9px 0 0;
      color: #176b59;
      font-size: 11px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="mark" aria-hidden="true">V</div>
    <div>
      <p class="eyebrow">Campus connection</p>
      <h1>VIT WiFi Auto Login</h1>
    </div>
  </header>

  <main>
    <form id="credentials">
      <p class="section-label">Login details</p>
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="p">Password</label>
        <div class="password-wrap">
          <input id="p" name="password" type="password" autocomplete="current-password">
          <button class="reveal" id="reveal" type="button" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="settings" aria-label="Login options">
        <label class="setting" for="en">
          <span>Enable auto-fill</span>
          <input id="en" type="checkbox">
        </label>
        <label class="setting" for="as">
          <span>Submit automatically</span>
          <input id="as" type="checkbox">
        </label>
      </div>

      <div class="actions">
        <button id="save" type="submit">Save settings</button>
        <button id="clear" type="button">Clear credentials</button>
      </div>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">Your credentials are stored locally in this browser.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
